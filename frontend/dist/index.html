form engineered for high-risk battlefield operations. Designed for precision, endurance, and versatility, it seamlessly supports combat, logistics, and casualty evacuation roles. With multi-mode operational capability, Vrishabh enhances force protection while extending operational reach in complex environments.",applications:"Built for defence and homeland security, Vrishabh supports frontline combat missions, border patrol, explosive ordnance disposal, tactical supply logistics, and casualty evacuation in contested environments.",features:[{title:"Multi-Mode Operation",description:"Manual, semi-autonomous & fully autonomous modes"},{title:"Combat-Ready Platform",description:"Integrated weapons support (MMG, LMG, AGS-30, NSVT)"},{title:"Rugged Mobility",description:"All-terrain chassis with independent suspension"},{title:"Mission Adaptive",description:"Modular payload bay for sensors, weapons, or medevac pods"}],video:h1,views:[{label:"Front View",image:GI},{label:"Side View",image:YI},{label:"Top View",image:ZI},{label:"Action View",image:QI}],brochure:qI,brochureName:"Vrishabh_Combat_UGV_Flyer.pdf",activeSpecTab:"performance",specTabs:{performance:[{label:"Maximum Speed",value:"50 km/h"},{label:"Acceleration (0-50 km/h)",value:"4 Seconds"},{label:"Range",value:"~100 km"},{label:"Endurance",value:"6 hours"},{label:"Payload Capacity",value:"150 kg"},{label:"Wheel Torque",value:"1000 Nm at wheels"},{label:"Towing Capacity",value:"300 kg (level ground)"}],power:[{label:"Power",value:"60 HP"},{label:"Battery",value:"16 kWh"}],dimensions:[{label:"L x W x H",value:"2250 x 1250 x 1420 mm"},{label:"Weight",value:"400 kg"}],weapons:[{label:"Weapons Platform",value:"2 Axis Stabilization"},{label:"Supported Weapons",value:"MMG, LMG, NSVT, AGS 30"}]}},{id:"wheeled-shvana",name:"Shvana",category:"robotic-platforms",categoryName:"Robotic Platforms",subCategory:"Advanced Quadruped Robot Platform",tagline:"Bharat's first armed quadruped platform",description:"Bhairav Robotics unv
